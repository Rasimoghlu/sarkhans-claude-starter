name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  macos-app:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          version="$(tr -d '[:space:]' < claude-web-starter/VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$version is already published. Bump claude-web-starter/VERSION to release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build app, installer and update package
        if: steps.version.outputs.exists == 'false'
        env:
          UPDATE_REPO: ${{ github.repository }}
        run: ./macos-app/build-app.sh --out="$RUNNER_TEMP/dist"

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        run: |
          version="${{ steps.version.outputs.version }}"
          git log -1 --format=%B > "$RUNNER_TEMP/notes.md"
          gh release create "v$version" \
            "$RUNNER_TEMP/dist/Sarkhans-Claude-Starter.dmg" \
            "$RUNNER_TEMP/dist/Sarkhans-Claude-Starter.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Sarkhans Claude Starter $version" \
            --notes-file "$RUNNER_TEMP/notes.md"
