name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASES_REPO: sarkhandigitech/sarkhans-claude-starter-releases

jobs:
  macos-app:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Missing secret RELEASES_TOKEN (Settings → Secrets and variables → Actions)." >&2
            exit 1
          fi
          version="$(tr -d '[:space:]' < claude-web-starter/VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$version is already published in $RELEASES_REPO. Bump claude-web-starter/VERSION to release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build app, installer and update package
        if: steps.version.outputs.exists == 'false'
        env:
          UPDATE_REPO: ${{ env.RELEASES_REPO }}
        run: ./macos-app/build-app.sh --out="$RUNNER_TEMP/dist"

      - name: Publish to the public releases repository
        if: steps.version.outputs.exists == 'false'
        run: |
          version="${{ steps.version.outputs.version }}"
          git log -1 --format=%B > "$RUNNER_TEMP/notes.md"
          gh release create "v$version" \
            "$RUNNER_TEMP/dist/Sarkhans-Claude-Starter.dmg" \
            "$RUNNER_TEMP/dist/Sarkhans-Claude-Starter.zip" \
            --repo "$RELEASES_REPO" \
            --title "Sarkhans Claude Starter $version" \
            --notes-file "$RUNNER_TEMP/notes.md"

      - name: Update the public README
        if: steps.version.outputs.exists == 'false'
        run: |
          version="${{ steps.version.outputs.version }}"
          sed -e "s|{{VERSION}}|$version|g" -e "s|{{REPO}}|$RELEASES_REPO|g" releases-repo/README.md > "$RUNNER_TEMP/README.md"
          sha="$(gh api "repos/$RELEASES_REPO/contents/README.md" --jq .sha 2>/dev/null || true)"
          content="$(base64 < "$RUNNER_TEMP/README.md" | tr -d '\n')"
          if [ -n "$sha" ]; then
            gh api -X PUT "repos/$RELEASES_REPO/contents/README.md" -f message="Sarkhans Claude Starter $version" -f content="$content" -f sha="$sha" >/dev/null
          else
            gh api -X PUT "repos/$RELEASES_REPO/contents/README.md" -f message="Sarkhans Claude Starter $version" -f content="$content" >/dev/null
          fi
