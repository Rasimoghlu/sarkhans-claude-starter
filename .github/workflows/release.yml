name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that VERSION matches the tag
        run: |
          version="$(tr -d '[:space:]' < claude-web-starter/VERSION)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "claude-web-starter/VERSION is $version but the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Build app, installer and update package
        run: ./macos-app/build-app.sh --out="$RUNNER_TEMP/dist"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/dist/Sarkhans-Claude-Starter.dmg" \
            "$RUNNER_TEMP/dist/Sarkhans-Claude-Starter.zip" \
            --title "Sarkhans Claude Starter ${GITHUB_REF_NAME#v}" \
            --generate-notes
